<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeverLate</title>
  <style>
    :root { --cream:#FBF7EF; --ink:#23304B; --muted:#5C6781; --line:#E6DECF; --accent:#2F6F6B; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { max-width:520px; margin:0 auto; padding:48px 26px; text-align:center; }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:2.2rem; margin:0 0 6px; }
    p { color:var(--muted); font-size:1.05rem; margin:0 0 28px; }
    .links { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    a.btn { display:inline-block; text-decoration:none; color:#fff; background:var(--accent);
      padding:12px 22px; border-radius:12px; font-size:1rem; }
    a.btn.alt { background:#fff; color:var(--ink); border:1px solid var(--line); }
  </style>
</head>
<body>
  <div class="card">
    <h1>NeverLate</h1>
    <p>The calendar that helps you actually show up.</p>
    <div class="links">
      <a class="btn" href="support.html">Support</a>
      <a class="btn alt" href="privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
